<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반응속도 측정기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="screen" class="screen idle">
    <div id="game-content">
      <div id="message">클릭해서 시작</div>
    </div>
    <div id="result-content" class="hidden">
      <div id="reaction-time"></div>
      <div class="nickname-form">
        <input id="nickname" type="text" placeholder="닉네임 입력" maxlength="12" />
        <button id="save-btn" type="button">기록 저장</button>
      </div>
      <div id="save-status"></div>
      <div id="best-record"></div>
      <ol id="ranking-list"></ol>
      <button id="retry-btn" type="button">다시 시작</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
